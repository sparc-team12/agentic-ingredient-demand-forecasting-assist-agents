[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
files = ["main.py", "db", "routes", "services", "middleware", "schemas", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
