name: Terraform

# Single-instance, single-environment (prod-only) pipeline for infra/ — DEC-009/
# DEC-011 flattened infra to one main.tf with no network/application split and
# no dev/qa/stage environments, so this pipeline has no per-stack/per-environment
# matrix (unlike infra-pipeline-agent's general template, which assumes both).

on:
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
  workflow_dispatch: {}

concurrency:
  group: terraform-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"
  TFLINT_VERSION: "v0.53.0"
  TF_DIR: "infra"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: ${{ env.TF_DIR }}
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_DIR }}
          soft_fail: false

  validate:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend — syntax/logic check only)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}         # Secret: AWS_ACCESS_KEY_ID
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret: AWS_SECRET_ACCESS_KEY
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
        # Secret: TFSTATE_BUCKET_NAME — still a placeholder ({{TFSTATE_BUCKET_NAME}}
        # in infra/main.tf's own comments) until the real AWS account/bucket exists.
        # key / dynamodb_table / encrypt are already hardcoded in main.tf's backend block.

      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=prod.tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.TF_DIR }}/prod.tfplan

      - name: Post plan output to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            core.summary.addHeading('Terraform Plan — prod').write();

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod # manual gate — configure Required reviewers on this GitHub Environment
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: ${{ env.TF_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}         # Secret: AWS_ACCESS_KEY_ID
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret: AWS_SECRET_ACCESS_KEY
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET_NAME }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply prod.tfplan
